<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理后台 - WeChat AI Publisher</title>
    
    <!-- Material Icons with fallback strategy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
      /* Material Icons - Defensive CSS to handle loading failures */
      .material-icons {
        font-family: 'Material Icons';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        /* Hide text if font fails to load */
        font-display: swap;
      }
      
      /* Fallback: if Material Icons font fails, hide the ligature text */
      .material-icons:not([data-loaded]) {
        max-width: 24px;
        max-height: 24px;
        overflow: hidden;
        text-indent: -9999px;
      }
      
      /* When font loads successfully, show icons properly */
      @supports (font-variation-settings: normal) {
        .material-icons {
          text-indent: 0;
        }
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      
      /* Modern UI Animations - Fade Effects */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes fadeOut {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      
      @keyframes slideInRight {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      
      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      
      /* Animation utility classes */
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
      
      .animate-slide-in-up {
        animation: slideInUp 0.4s ease-out forwards;
      }
      
      .animate-scale-in {
        animation: scaleIn 0.3s ease-out forwards;
      }
      
      /* Smooth transitions */
      button, a, input, select, textarea {
        transition: all 0.2s ease-in-out;
      }
      
      /* Mobile-optimized touch targets */
      @media (max-width: 768px) {
        button, a[role="button"], input[type="checkbox"], input[type="radio"] {
          min-height: 44px;
          min-width: 44px;
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-900 min-h-screen">
    <div id="admin-root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
