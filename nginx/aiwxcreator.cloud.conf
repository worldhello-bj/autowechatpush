# Nginx configuration for www.aiwxcreator.cloud
# This configuration sets up a reverse proxy from Nginx to Node.js backend (port 3001)
# and includes HTTPS/SSL support via Certbot/Let's Encrypt
#
# Installation Instructions:
# 1. Copy this file to /etc/nginx/sites-available/aiwxcreator.cloud
#    sudo cp nginx/aiwxcreator.cloud.conf /etc/nginx/sites-available/aiwxcreator.cloud
#
# 2. Create symbolic link to enable the site
#    sudo ln -s /etc/nginx/sites-available/aiwxcreator.cloud /etc/nginx/sites-enabled/
#
# 3. Remove default site if not needed
#    sudo rm /etc/nginx/sites-enabled/default
#
# 4. Test Nginx configuration
#    sudo nginx -t
#
# 5. Reload Nginx
#    sudo systemctl reload nginx
#
# 6. Install SSL certificate with Certbot
#    sudo certbot --nginx -d aiwxcreator.cloud -d www.aiwxcreator.cloud

server {
    listen 80;
    listen [::]:80;
    server_name aiwxcreator.cloud www.aiwxcreator.cloud;

    # Enable gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Reverse proxy to Node.js backend
    location / {
        proxy_pass http://127.0.0.1:3001;

        # Pass real IP and headers to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # SSE (Server-Sent Events) support
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}

# HTTPS configuration - This section will be automatically managed by Certbot
# After running `sudo certbot --nginx`, the following block will be auto-generated:
