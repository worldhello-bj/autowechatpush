# Nginx configuration for www.aiwxcreator.cloud
# This configuration sets up a reverse proxy from Nginx to Node.js backend (port 3001)
# and includes HTTPS/SSL support via Certbot/Let's Encrypt
#
# Installation Instructions:
# 1. Copy this file to /etc/nginx/sites-available/aiwxcreator.cloud
#    sudo cp nginx/aiwxcreator.cloud.conf /etc/nginx/sites-available/aiwxcreator.cloud
#
# 2. Create symbolic link to enable the site
#    sudo ln -s /etc/nginx/sites-available/aiwxcreator.cloud /etc/nginx/sites-enabled/
#
# 3. Remove default site if not needed
#    sudo rm /etc/nginx/sites-enabled/default
#
# 4. Test Nginx configuration
#    sudo nginx -t
#
# 5. Reload Nginx
#    sudo systemctl reload nginx
#
# 6. Install SSL certificate with Certbot
#    sudo certbot --nginx -d aiwxcreator.cloud -d www.aiwxcreator.cloud

# Map for conditional WebSocket Connection header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name aiwxcreator.cloud www.aiwxcreator.cloud;

    # Enable gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # SSE (Server-Sent Events) endpoint with long timeout
    location /api/v1/ai/chat/stream {
        proxy_pass http://127.0.0.1:3001;

        # Pass real IP and headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support - disable buffering and set long timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API proxy - all API requests
    location /api/ {
        proxy_pass http://127.0.0.1:3001;

        # Pass real IP and headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support with conditional Connection header
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        # Reasonable timeout for API requests
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }

    # Frontend and other requests
    location / {
        proxy_pass http://127.0.0.1:3001;

        # Pass real IP and headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support with conditional Connection header
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        # Standard timeout for regular requests
        proxy_read_timeout 60;
        proxy_buffering off;
    }
}

# HTTPS configuration - This section will be automatically managed by Certbot
# After running `sudo certbot --nginx`, the following block will be auto-generated:
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name aiwxcreator.cloud www.aiwxcreator.cloud;
#
#     ssl_certificate /etc/letsencrypt/live/aiwxcreator.cloud/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/aiwxcreator.cloud/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#     # ... (same location block as above)
# }
